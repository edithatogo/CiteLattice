name: Temporary Rustfmt PR12 refactor
on:
  push:
    branches: [ci/rustfmt-pr12b-20261112]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Format and remove temporary helper
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --all
          rm .github/workflows/_temporary_pr12b_rustfmt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --quiet || git commit -m "ci: format Rust and remove temporary helper"
          git push origin HEAD:refs/heads/ci/rustfmt-pr12b-20261112

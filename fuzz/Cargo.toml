[package]
name = "citelattice-boundary-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]
resolver = "3"

[dependencies]
libfuzzer-sys = "=0.4.13"
citelattice-ingest = { path = "../crates/citelattice-ingest" }

[[bin]]
name = "source_events"
path = "fuzz_targets/source_events.rs"
test = false
doc = false
bench = false

[profile.release]
opt-level = 1
codegen-units = 16
